<div id="content-wrapper" class="recordings-container">
	<div class="content">
		<table class="monster-table settings-users-table">
			<thead>
				<tr>
					<th>Name</th>
					<th>Username</th>
					<th>Inbound External</th>
					<th>Outbound External</th>
					<th>Inbound Internal</th>
					<th>Outbound Internal</th>
				</tr>
			</thead>
			<tbody>
				{{#each users}}
				<tr class="user-row" data-user-id="{{id}}">
					<td>{{name}}</td>
					<td>{{username}}</td>
					<td>
						{{#monsterSwitch}}
						<input class="recording-toggle" data-type="inbound-offnet" type="checkbox" {{#if inbound_external_enabled}}checked{{/if}} />
						{{/monsterSwitch}}
					</td>
					<td>
						{{#monsterSwitch}}
						<input class="recording-toggle" data-type="outbound-offnet" type="checkbox" {{#if outbound_external_enabled}}checked{{/if}} />
						{{/monsterSwitch}}
					</td>
					<td>
						{{#monsterSwitch}}
						<input class="recording-toggle" data-type="inbound-onnet" type="checkbox" {{#if inbound_internal_enabled}}checked{{/if}} />
						{{/monsterSwitch}}
					</td>
					<td>
						{{#monsterSwitch}}
						<input class="recording-toggle" data-type="outbound-onnet" type="checkbox" {{#if outbound_internal_enabled}}checked{{/if}} />
						{{/monsterSwitch}}
					</td>
				</tr>
				{{/each}}
			</tbody>
		</table>
	</div>
</div>
